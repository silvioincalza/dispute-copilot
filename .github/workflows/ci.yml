name: CI — Build, Test & Eval Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

jobs:
  # ─────────────────────────────────────────────────────────────
  # Build and test Spring Boot service
  # ─────────────────────────────────────────────────────────────
  build-dispute-service:
    name: Build Dispute Service (Java)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dispute-service

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: disputedb_test
          POSTGRES_USER: disputeuser
          POSTGRES_PASSWORD: disputepass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: mvn -B verify
        env:
          DB_URL: jdbc:postgresql://localhost:5432/disputedb_test
          DB_USER: disputeuser
          DB_PASS: disputepass
          OPENAI_API_KEY: ${{ env.OPENAI_API_KEY || 'test-key' }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-test-results
          path: dispute-service/target/surefire-reports/

  # ─────────────────────────────────────────────────────────────
  # Build and test Python document intake
  # ─────────────────────────────────────────────────────────────
  build-document-intake:
    name: Build Document Intake (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: document-intake

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: |
          pip install ruff
          ruff check app/

      - name: Build Docker image
        run: docker build -t dispute-document-intake:ci .

  # ─────────────────────────────────────────────────────────────
  # Build React UI
  # ─────────────────────────────────────────────────────────────
  build-ui:
    name: Build UI (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build

  # ─────────────────────────────────────────────────────────────
  # Eval Suite (CI Gate) — only runs on main branch or explicit trigger
  # ─────────────────────────────────────────────────────────────
  eval-gate:
    name: Eval Suite — LLM-as-Judge Gate
    runs-on: ubuntu-latest
    needs: [build-dispute-service, build-document-intake]
    if: github.ref == 'refs/heads/main' && secrets.OPENAI_API_KEY != ''

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: disputedb
          POSTGRES_USER: disputeuser
          POSTGRES_PASSWORD: disputepass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build dispute service
        run: mvn -B package -DskipTests
        working-directory: dispute-service

      - name: Start dispute service
        run: |
          java -jar dispute-service/target/*.jar \
            --spring.profiles.active=ci &
          echo "Waiting for service to start..."
          timeout 120 bash -c 'until curl -sf http://localhost:8080/actuator/health; do sleep 3; done'
        env:
          DB_URL: jdbc:postgresql://localhost:5432/disputedb
          DB_USER: disputeuser
          DB_PASS: disputepass
          OPENAI_API_KEY: ${{ env.OPENAI_API_KEY }}

      - name: Set up Python for eval suite
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install eval dependencies
        run: pip install -r eval-suite/requirements.txt

      - name: Run eval suite
        run: python eval-suite/eval_suite.py
        env:
          DISPUTE_SERVICE_URL: http://localhost:8080
          OPENAI_API_KEY: ${{ env.OPENAI_API_KEY }}
          PASS_THRESHOLD: "0.75"

      - name: Upload eval report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: eval-report.json
